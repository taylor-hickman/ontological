[project]
name = "ontological"
version = "0.0.0"
description = "Ontological's engine: catalog, compile, retrieval, answer agent and Claude gateway."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.19.1",
    "claude-agent-sdk>=0.2.178",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "keyring>=25",
    "langchain-core>=1.6.1",
    "langchain-postgres>=0.0.17",
    "mcp>=2.3.0",
    "numpy>=2.5.2",
    "pandas>=2.3.3,<3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.0.52,<2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ontological-engine = "ontological.engine.main:cli"
ontological-mcp = "ontological.mcp.main:cli"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
# auto_ontology is upstream's package, vendored under its own name so each file diffs cleanly
# against upstream (auto_ontology/UPSTREAM.md).
module-name = ["ontological", "auto_ontology"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["auto_ontology"]  # vendored upstream code keeps upstream's formatting

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["ontological", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # tests/fakes.py
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
