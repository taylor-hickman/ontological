# The engine's and eval's checks on every pull request and push to main. Linux covers them: a macOS
# minute bills at ten times a Linux one, so macos.yml runs the same checks on macOS arm64 only when
# started by hand. The tests that need Postgres (the store, the engine on the real store,
# dense search, the catalog ingest, upstream's golden DAL suite and the eval cluster) run here on
# PGDG's PostgreSQL 17 and 16; postgres.yml runs them on the bundled macOS tree when its build
# changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: engine
          enable-cache: true
      - run: uv sync --locked
      - uses: ./.github/actions/embedding-model
      - uses: ./.github/actions/postgres-linux
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -ra
        env:
          ONTOLOGICAL_GOLDEN_REPORTS: ${{ runner.temp }}/golden
      - name: Upload the golden DAL suite's reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-dal-reports
          path: ${{ runner.temp }}/golden
          if-no-files-found: ignore

  eval:
    name: eval (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: eval
          enable-cache: true
      - run: uv sync --locked
      - uses: ./.github/actions/postgres-linux
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -ra
