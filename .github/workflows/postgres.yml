name: Bundled Postgres

# Builds the PostgreSQL 17 + pgvector binaries the app bundles (ARCHITECTURE.md §10, spike S4):
# minimal configure, trimmed to the shipped file list, signed with the hardened runtime, then
# smoke-tested and run through the store lifecycle tests (§5.3 and §12: engine/tests/store, which
# test engine/ontological/store/pg.py and its Alembic chains, and ops.llm_call through
# engine/ontological/llm/calls.py), the engine's idle shutdown on the
# real store (engine/tests/engine/test_engine_pg.py) and the eval cluster's tests
# (eval/tests/test_cluster.py). Runs when the scripts, the store, the vendored chain, the
# engine's dependencies or the eval cluster change, or by hand.
on:
  push:
    branches: [main]
    paths:
      - tools/spikes/s4_postgres/**
      - tools/spikes/s5_pg_lifecycle/**
      - engine/ontological/store/**
      - engine/ontological/llm/calls.py
      - engine/auto_ontology/**
      - engine/pyproject.toml
      - engine/uv.lock
      - engine/tests/store/**
      - engine/tests/engine/test_engine_pg.py
      - eval/ontological_eval/cluster.py
      - eval/ontological_eval/home.py
      - eval/tests/test_cluster.py
      - .github/workflows/postgres.yml
  pull_request:
    paths:
      - tools/spikes/s4_postgres/**
      - tools/spikes/s5_pg_lifecycle/**
      - engine/ontological/store/**
      - engine/ontological/llm/calls.py
      - engine/auto_ontology/**
      - engine/pyproject.toml
      - engine/uv.lock
      - engine/tests/store/**
      - engine/tests/engine/test_engine_pg.py
      - eval/ontological_eval/cluster.py
      - eval/ontological_eval/home.py
      - eval/tests/test_cluster.py
      - .github/workflows/postgres.yml
  workflow_dispatch:

concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: postgres (macOS arm64)
    runs-on: macos-15
    defaults:
      run:
        working-directory: tools/spikes/s4_postgres
    steps:
      - uses: actions/checkout@v5
      - run: echo "WORK=$RUNNER_TEMP/s4" >>"$GITHUB_ENV"
      - name: Build PostgreSQL, pg_trgm and pgvector
        run: ./build.sh "$WORK"
      - name: Trim to the shipped file list and make relocatable
        run: ./trim.sh "$WORK/postgres" "$WORK/dist"
      - name: Sign with the hardened runtime (ad-hoc)
        run: ./sign.sh "$WORK/dist" entitlements.plist
      # The runner has SIP off, so library validation isn't enforced and control.sh skips.
      # Run it on a Mac with SIP on to see why entitlements.plist is needed.
      - name: Show library validation blocks loading without the entitlement (skips with SIP off)
        run: ./control.sh "$WORK/dist"
      - name: Smoke test (initdb, forks, vector.dylib, pg_trgm, dump and restore)
        run: ./smoke.sh "$WORK/dist"
      - name: Build PostgreSQL 16 for the major-version case
        run: VERSIONS_ENV=../s5_pg_lifecycle/pg16.env ./build.sh "$RUNNER_TEMP/pg16"
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: engine
          enable-cache: true
      - name: Store lifecycle tests (first launch, stop, adopt, stale pid, second engine, restore, 16 to 17, disk full), and the engine idling out on the store
        working-directory: engine
        env:
          ONTOLOGICAL_PG_BIN: ${{ env.WORK }}/dist/bin
          ONTOLOGICAL_PG16_BIN: ${{ runner.temp }}/pg16/postgres/bin
          ONTOLOGICAL_PG_REQUIRED: "1"
        run: |
          uv sync --locked
          uv run pytest tests/store tests/engine/test_engine_pg.py -ra
      - name: Eval cluster tests (WWI-shaped load, adopt, failed load, row-count check)
        working-directory: eval
        env:
          ONTOLOGICAL_PG_BIN: ${{ env.WORK }}/dist/bin
          ONTOLOGICAL_PG_REQUIRED: "1"
        run: |
          uv sync --locked
          uv run pytest tests/test_cluster.py -ra
      - name: Package and measure
        run: |
          source versions.env
          name="postgres-$PG_VERSION-pgvector-$PGVECTOR_VERSION-darwin-arm64"
          tar -C "$WORK/dist" -cJf "$WORK/$name.tar.xz" .
          echo "NAME=$name" >>"$GITHUB_ENV"
          {
            echo "## PostgreSQL $PG_VERSION + pgvector $PGVECTOR_VERSION, trimmed"
            echo
            ./measure.sh "$WORK/dist" "$WORK/$name.tar.xz"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.WORK }}/${{ env.NAME }}.tar.xz
          if-no-files-found: error
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-build-logs
          path: |
            ${{ env.WORK }}/configure.log
            ${{ env.WORK }}/make.log
          if-no-files-found: ignore
