<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ontological</title>
    <!--
      ARCHITECTURE.md §4.1. Everything loads from the app itself; fonts are bundled, so there is
      no Google Fonts. connect-src gains the engine's http://127.0.0.1:<port> when the engine
      supervisor lands (M2.7).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
