# The engine's checks on every pull request and push to main. Linux covers them: a macOS minute
# bills at ten times a Linux one, so macos.yml runs the same checks on macOS arm64 only for the
# changes that need it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: engine
          enable-cache: true
      - run: uv sync --locked
      - uses: ./.github/actions/embedding-model
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # The runner ships MySQL 8 stopped, with root's password set to root. The source executor
      # tests read it through DuckDB's mysql_scanner (engine/tests/sources/test_scanners.py).
      - run: sudo systemctl start mysql.service
      - run: uv run pytest
        env:
          ONTOLOGICAL_MYSQL_URL: mysql://root:root@127.0.0.1:3306
          ONTOLOGICAL_MYSQL_REQUIRED: "1"

  eval:
    name: eval (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: eval
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # The cluster tests skip here: they need the bundled binaries, so postgres.yml runs them.
      - run: uv run pytest
